<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pebble</title>
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <div class="group">
          <button id="btn-new" title="New tab (Cmd+N)">New</button>
          <button id="btn-open" title="Open (Cmd+O)">Open</button>
          <button id="btn-save" title="Save (Cmd+S)">Save</button>
          <button id="btn-saveas" title="Save As (Shift+Cmd+S)">Save As</button>
        </div>
        <div class="group" id="mode-switch" role="tablist">
          <button data-mode="wysiwyg" class="active">WYSIWYG</button>
          <button data-mode="source">Source</button>
          <button data-mode="split">Split</button>
        </div>
        <div class="group right">
          <button id="btn-outline" title="Toggle outline">Outline</button>
          <button id="btn-find" title="Find &amp; Replace (Cmd+F)">Find</button>
          <button id="btn-export" title="Export HTML">Export</button>
          <button id="btn-print" title="Print / PDF (Cmd+P)">PDF</button>
        </div>
      </header>

      <nav id="tabbar"></nav>

      <div id="find-bar" hidden>
        <input id="find-input" type="text" placeholder="Find" />
        <input id="replace-input" type="text" placeholder="Replace" />
        <span id="find-count" class="muted">0/0</span>
        <button id="find-prev" title="Previous">&#8593;</button>
        <button id="find-next" title="Next">&#8595;</button>
        <button id="replace-one">Replace</button>
        <button id="replace-all">All</button>
        <button id="find-close" title="Close">&#215;</button>
      </div>

      <div id="main-row">
        <aside id="sidebar" hidden>
          <div class="sidebar-title">Outline</div>
          <ul id="outline-list"></ul>
        </aside>

        <div id="editor-col">
          <textarea id="frontmatter-box" spellcheck="false" hidden
            title="Document frontmatter"></textarea>
          <div id="panes">
            <div id="wysiwyg-pane" class="pane"></div>
            <div id="text-pane" class="pane" hidden>
              <textarea id="source" spellcheck="false" placeholder="# Start writing..."></textarea>
              <div id="preview" class="markdown-body"></div>
            </div>
          </div>
        </div>
      </div>

      <footer id="statusbar">
        <span id="stat-words">0 words</span>
        <span id="stat-chars">0 chars</span>
        <span id="stat-read">0 min read</span>
        <span id="stat-save" class="muted"></span>
      </footer>
    </div>

    <div id="print-root" class="markdown-body"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
